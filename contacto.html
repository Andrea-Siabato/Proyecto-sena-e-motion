<!DOCTYPE html>
<html lang="es-COP">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · e-Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2300c2a8'/%3E%3C/svg%3E">
</head>
<body data-page="contacto">
  <div id="chrome"></div>
  <main class="wrap" style="padding:40px 0 72px">
    <span class="kicker">Soporte</span>
    <h1>Contacto</h1>
    <p class="lead" style="max-width:48ch;color:var(--muted)">Asesoría de producto, garantías y seguimiento de pedidos. Este formulario quedará conectado a tu backend.</p>
    <form class="form-grid" id="contact-form" style="margin-top:24px">
      <label>Nombre <input name="name" required></label>
      <label>Correo <input type="email" name="email" required></label>
      <label class="full">Asunto
        <select name="topic">
          <option>Pedido</option>
          <option>Garantía</option>
          <option>Producto</option>
          <option>Otro</option>
        </select>
      </label>
      <label class="full">Mensaje <textarea name="message" required></textarea></label>
      <div class="full"><button class="btn btn-primary" type="submit">Enviar</button></div>
    </form>
    <p style="margin-top:28px">WhatsApp prototipo · +52 55 0000 0000 · Lun–Vie 9:00–18:00</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      EMOTION.ui.toast("Mensaje registrado (simulado). Conecta POST /api/contact");
      e.target.reset();
    });
  </script>
</body>
</html>
