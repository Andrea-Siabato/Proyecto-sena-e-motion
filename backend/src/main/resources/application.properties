server.port=8080
# Devuelve el mensaje de las excepciones al frontend
server.error.include-message=always

# XAMPP: usuario root, sin contrasena por defecto, puerto 3306
spring.datasource.url=jdbc:mysql://localhost:3306/emotion_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect