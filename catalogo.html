<!DOCTYPE html>
<html lang="es-COP">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · e-Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2300c2a8'/%3E%3C/svg%3E">
</head>
<body data-page="catalog">
  <div id="chrome"></div>
  <main class="wrap catalog-layout">
    <aside class="filters" aria-label="Filtros">
      <h2>Filtros</h2>
      <h3>Categoría</h3>
      <select id="f-cat">
        <option value="">Todas</option>
        <option value="patinetas">Patinetas</option>
        <option value="bicicletas">Bicicletas</option>
        <option value="accesorios">Accesorios</option>
        <option value="repuestos">Repuestos</option>
        <option value="seguridad">Seguridad</option>
      </select>
      <h3>Precio (COP)</h3>
      <input type="number" id="f-min" min="0" placeholder="Mínimo">
      <input type="number" id="f-max" min="0" placeholder="Máximo">
      <h3>Marca</h3>
      <select id="f-brand"><option value="">Todas</option></select>
      <h3>Autonomía mínima (km)</h3>
      <select id="f-range">
        <option value="">Cualquiera</option>
        <option value="30">30+</option>
        <option value="45">45+</option>
        <option value="60">60+</option>
      </select>
      <h3>Velocidad mínima (km/h)</h3>
      <select id="f-speed">
        <option value="">Cualquiera</option>
        <option value="20">20+</option>
        <option value="25">25+</option>
        <option value="28">28+</option>
      </select>
      <h3>Potencia mínima (W)</h3>
      <select id="f-power">
        <option value="">Cualquiera</option>
        <option value="250">250+</option>
        <option value="450">450+</option>
        <option value="650">650+</option>
      </select>
      <h3>Disponibilidad</h3>
      <select id="f-stock">
        <option value="">Todas</option>
        <option value="in">En stock</option>
        <option value="out">Agotados</option>
      </select>
      <button class="btn btn-ghost" type="button" id="f-reset" style="width:100%;margin-top:12px">Limpiar</button>
    </aside>
    <section>
      <div class="toolbar">
        <h1 id="cat-title">Catálogo</h1>
        <label>Ordenar
          <select id="sort">
            <option value="sold">Más vendidos</option>
            <option value="price-asc">Precio menor</option>
            <option value="price-desc">Precio mayor</option>
            <option value="rating">Mejor valorados</option>
            <option value="new">Más recientes</option>
          </select>
        </label>
      </div>
      <p class="note" id="cat-count"></p>
      <div class="grid-products" id="grid"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
